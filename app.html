<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講座アーカイブ管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d1a;
      --surface: #161626;
      --surface2: #1e1e32;
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(139,92,246,0.5);
      --accent: #8b5cf6;
      --accent2: #6366f1;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-count {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      margin-left: 10px;
    }
    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-header:hover { border-color: var(--border-active); color: var(--text); }
    .btn-header.export { border-color: rgba(16,185,129,0.3); color: #6ee7b7; background: rgba(16,185,129,0.08); }
    .btn-header.export:hover { background: rgba(16,185,129,0.18); }
    .btn-header.import { border-color: rgba(96,165,250,0.3); color: #93c5fd; background: rgba(96,165,250,0.08); }
    .btn-header.import:hover { background: rgba(96,165,250,0.18); }

    /* インポート確認モーダル */
    .import-modal {
      background: #1a1a2e;
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
    }
    .import-modal h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 12px;
    }
    .import-modal p {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .import-modal strong { color: var(--text); }
    .import-choice {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-choice {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-choice:hover { border-color: var(--border-active); background: rgba(139,92,246,0.08); }
    .btn-choice .choice-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
      display: block;
      margin-top: 3px;
    }
    .btn-choice-cancel {
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      width: 100%;
    }
    .btn-choice-cancel:hover { color: var(--text); }

    /* ===== LAYOUT ===== */
    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 0;
      min-height: calc(100vh - 65px);
    }

    /* ===== LEFT PANEL ===== */
    .panel-left {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="url"]:focus,
    textarea:focus {
      border-color: var(--border-active);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    /* ===== MEMO AREA ===== */
    .memo-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }
    .memo-hint span { color: #a78bfa; }

    .parsed-preview {
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      display: none;
    }
    .parsed-preview.show { display: block; }
    .parsed-preview h4 {
      font-size: 0.72rem;
      color: var(--success);
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }
    .parsed-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .parsed-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .parsed-item-info { flex: 1; min-width: 0; }
    .parsed-item-info .pi-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .parsed-item-info .pi-url {
      font-size: 0.7rem;
      color: #60a5fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .parsed-item-info .pi-edit {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }
    .parsed-item-info .pi-edit input {
      font-size: 0.75rem;
      padding: 4px 8px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover { background: #7c3aed; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 100%;
    }
    .btn-secondary:hover { border-color: var(--border-active); }
    .btn-success {
      background: var(--success);
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }
    .btn-success:hover { background: #059669; }

    /* ===== RIGHT PANEL ===== */
    .panel-right {
      overflow-y: auto;
      padding: 24px;
    }

    /* ===== SEARCH & FILTER ===== */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .search-bar input {
      flex: 1;
    }
    select {
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
    }

    /* ===== 講師タブ ===== */
    .instructor-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .itab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .itab:hover { border-color: rgba(139,92,246,0.4); color: var(--text); }
    .itab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .itab .itab-count {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.68rem;
      margin-left: 4px;
    }
    .itab.active .itab-count { background: rgba(255,255,255,0.25); }

    /* ===== CARDS ===== */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
      position: relative;
    }
    .card:hover {
      border-color: rgba(139,92,246,0.3);
      background: var(--surface2);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .card-instructor {
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.3);
      color: #c4b5fd;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
    }
    .card-url {
      font-size: 0.7rem;
      color: #60a5fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-open {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
    }
    .btn-open:hover { background: rgba(99,102,241,0.35); }
    .btn-delete {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }
    .btn-delete:hover { background: rgba(239,68,68,0.25); }
    .btn-doc-open {
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.25);
      color: #6ee7b7;
    }
    .btn-doc-open:hover { background: rgba(52,211,153,0.25); }

    /* platform badge */
    .badge-yt   { background: rgba(239,68,68,0.15);  color: #fca5a5;  border: 1px solid rgba(239,68,68,0.3); }
    .badge-zoom { background: rgba(59,130,246,0.15); color: #93c5fd;  border: 1px solid rgba(59,130,246,0.3);}
    .badge-vimeo{ background: rgba(26,183,234,0.15); color: #7dd3fc;  border: 1px solid rgba(26,183,234,0.3);}
    .badge-other{ background: rgba(100,116,139,0.15);color: #cbd5e1;  border: 1px solid rgba(100,116,139,0.3);}

    /* ===== EMPTY STATE ===== */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty p { font-size: 0.9rem; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== RESPONSIVE / iPhone ===== */
    @media (max-width: 768px) {
      /* ヘッダー */
      header { padding: 12px 14px; gap: 8px; flex-wrap: wrap; }
      header h1 { font-size: 1rem; }
      .header-count { font-size: 0.72rem; padding: 3px 8px; }
      .header-actions { gap: 6px; margin-left: 0; width: 100%; justify-content: flex-end; }
      .btn-header { font-size: 0.7rem; padding: 5px 9px; }

      /* レイアウト */
      .layout { grid-template-columns: 1fr; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); padding: 16px; }
      .panel-right { padding: 16px; }

      /* 検索バー：縦積み */
      .search-bar { flex-wrap: wrap; gap: 8px; }
      .search-bar input { min-width: 0; flex: 1 1 100%; }
      .search-bar select { flex: 1 1 calc(50% - 4px); font-size: 0.8rem; padding: 9px 8px; }

      /* 講師タブ */
      .itab { font-size: 0.72rem; padding: 5px 10px; }

      /* カード */
      .card { padding: 12px 14px; }
      .card-main { gap: 10px; }
      .card-icon { width: 36px; height: 36px; font-size: 1rem; }
      .card-title { font-size: 0.85rem; }
      .card-meta { flex-wrap: wrap; gap: 5px; }
      .card-url { font-size: 0.65rem; }

      /* カードアクションボタン：小さく・折り返し */
      .card-actions { flex-wrap: wrap; gap: 5px; justify-content: flex-end; max-width: 80px; }
      .btn-icon { width: 32px; height: 32px; font-size: 0.82rem; }

      /* フォーム */
      .tabs { gap: 3px; }
      .tab { font-size: 0.78rem; padding: 7px 6px; }

      /* モーダル */
      .modal { padding: 20px 16px; }
      .import-modal { padding: 20px 16px; }

      /* トースト */
      .toast { right: 12px; left: 12px; bottom: 16px; font-size: 0.8rem; text-align: center; }

      /* 学びセクション */
      .learn-text { font-size: 0.78rem; }
    }

    /* さらに小さい端末（SE など） */
    @media (max-width: 375px) {
      header h1 { font-size: 0.88rem; }
      .card-actions { max-width: 70px; }
      .btn-icon { width: 29px; height: 29px; font-size: 0.75rem; }
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* ===== 学びセクション ===== */
    .card {
      flex-direction: column;
      align-items: stretch;
    }
    .card-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .learn-section {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .learn-section.open { display: block; }
    .learn-row {
      margin-bottom: 12px;
    }
    .learn-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .learn-text {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.7;
      white-space: pre-wrap;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .learn-audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.3);
      color: #c4b5fd;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .learn-audio-btn:hover { background: rgba(167,139,250,0.25); }
    .btn-learn {
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25);
      color: #c4b5fd;
      font-size: 0.72rem;
    }
    .btn-learn:hover { background: rgba(167,139,250,0.25); }
    .btn-learn.has-learn {
      background: rgba(167,139,250,0.2);
      border-color: rgba(167,139,250,0.5);
      color: #a78bfa;
    }

    /* ===== 編集ボタン ===== */
    .btn-edit {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.25);
      color: #fde68a;
    }
    .btn-edit:hover { background: rgba(251,191,36,0.25); }

    /* ===== 編集モーダル ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #1a1a2e;
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #c4b5fd;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions .btn { flex: 1; }
    .btn-save {
      background: var(--accent);
      color: #fff;
    }
    .btn-save:hover { background: #7c3aed; }
    .btn-cancel {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-cancel:hover { border-color: var(--border-active); color: var(--text); }

    /* ===== 削除確認モーダル ===== */
    .delete-modal {
      background: #1a1a2e;
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .delete-modal .del-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .delete-modal h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #fca5a5;
      margin-bottom: 8px;
    }
    .delete-modal p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .delete-modal p strong { color: var(--text); }
    .delete-modal-actions { display: flex; gap: 10px; }
    .btn-del-confirm {
      flex: 1; padding: 11px; border-radius: 9px;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn-del-confirm:hover { background: rgba(239,68,68,0.3); }
    .btn-del-cancel {
      flex: 1; padding: 11px; border-radius: 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.88rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn-del-cancel:hover { border-color: var(--border-active); color: var(--text); }

    /* ===== 日付入力（ダークテーマ） ===== */
    input[type="date"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
      color-scheme: dark;
    }
    input[type="date"]:focus { border-color: var(--border-active); }

    /* カード内の日付バッジ */
    .card-date {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
      color: #a78bfa;
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.25);
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ===== URL確認ボタン ===== */
    .btn-check {
      flex-shrink: 0;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid rgba(99,102,241,0.4);
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-check:hover:not(:disabled) {
      background: rgba(99,102,241,0.35);
      border-color: #6366f1;
    }
    .btn-check:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .url-status {
      margin-top: 6px;
      font-size: 0.72rem;
      min-height: 16px;
      transition: all 0.2s;
    }
    .url-status.ok   { color: #10b981; }
    .url-status.warn { color: #f59e0b; }

    /* 解析結果の確認ボタン */
    .btn-check-mini {
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid rgba(99,102,241,0.4);
      background: rgba(99,102,241,0.12);
      color: #a5b4fc;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-check-mini:hover {
      background: rgba(99,102,241,0.3);
    }

    /* 登録ボタンのロック状態 */
    .btn-primary.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<header>

例）

https://vimeo.com/xxx"></textarea>

      </button>

<script>
// ===== データ管理 =====
const STORAGE_KEY = 'lecture_archives_v2';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== プラットフォーム判定 =====
function getPlatform(url) {
  if (!url) return 'other';
  const u = url.toLowerCase();
  if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
  if (u.includes('zoom.us')) return 'zoom';
  if (u.includes('vimeo.com')) return 'vimeo';
  return 'other';
}
function getPlatformIcon(p) {
  return { youtube: '▶️', zoom: '💻', vimeo: '🎬', other: '🔗' }[p] || '🔗';
}
function getPlatformLabel(p) {
  return { youtube: 'YouTube', zoom: 'Zoom', vimeo: 'Vimeo', other: 'Link' }[p] || 'Link';
}
function getPlatformColor(p) {
  return { youtube: 'badge-yt', zoom: 'badge-zoom', vimeo: 'badge-vimeo', other: 'badge-other' }[p] || 'badge-other';
}

// ===== TAB切替 =====
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`#tab-${name}`).classList.add('active');
  event.target.classList.add('active');
}

// ===== 講師名セレクト =====
function onInstructorSelect() {
  const sel = document.getElementById('f-instructor-select');
  const manual = document.getElementById('f-instructor-manual');
  if (sel.value === '__manual__') {
    manual.style.display = 'block';
    manual.focus();
  } else {
    manual.style.display = 'none';
    manual.value = '';
  }
}

function getInstructor() {
  const sel = document.getElementById('f-instructor-select');
  if (sel.value === '__manual__') return document.getElementById('f-instructor-manual').value.trim();
  return sel.value;
}

// ===== URL確認（手動入力） =====
function updateCheckBtn() {
  const url = document.getElementById('f-url').value.trim();
  const btn = document.getElementById('checkBtn');
  const status = document.getElementById('urlStatus');
  btn.disabled = !url;
  if (!url) { status.textContent = ''; status.className = 'url-status'; }
  // URLが変わったら確認済みフラグをリセット
  btn.dataset.confirmed = '';
  status.textContent = '';
  status.className = 'url-status';
  updateAddBtn();
}

function checkUrl() {
  const url = document.getElementById('f-url').value.trim();
  if (!url) return;
  window.open(url, '_blank');
  const btn = document.getElementById('checkBtn');
  const status = document.getElementById('urlStatus');
  btn.dataset.confirmed = 'true';
  btn.textContent = '✅ 確認済';
  btn.style.background = 'rgba(16,185,129,0.15)';
  btn.style.borderColor = 'rgba(16,185,129,0.5)';
  btn.style.color = '#6ee7b7';
  status.textContent = 'URLを開きました。アクセスできたら「追加する」で登録してください。';
  status.className = 'url-status ok';
  updateAddBtn();
}

function updateAddBtn() {
  const btn = document.getElementById('checkBtn');
  const addBtn = document.getElementById('addBtn');
  const url = document.getElementById('f-url').value.trim();
  if (!url) {
    // URLなし → 制限なし（タイトルだけの登録も許可）
    addBtn.classList.remove('locked');
    addBtn.title = '';
    return;
  }
  const confirmed = btn.dataset.confirmed === 'true';
  if (confirmed) {
    addBtn.classList.remove('locked');
    addBtn.title = '';
  } else {
    addBtn.classList.add('locked');
    addBtn.title = 'URLを「確認」ボタンで開いてから登録してください';
  }
}

function updateDocCheckBtn() {
  const url = document.getElementById('f-doc-url').value.trim();
  const btn = document.getElementById('docCheckBtn');
  const status = document.getElementById('docUrlStatus');
  btn.disabled = !url;
  btn.dataset.confirmed = '';
  btn.textContent = '確認';
  btn.style.background = btn.style.borderColor = btn.style.color = '';
  status.textContent = '';
  status.className = 'url-status';
}

function checkDocUrl() {
  const url = document.getElementById('f-doc-url').value.trim();
  if (!url) return;
  window.open(url, '_blank');
  const btn = document.getElementById('docCheckBtn');
  btn.dataset.confirmed = 'true';
  btn.textContent = '✅ 確認済';
  btn.style.background = 'rgba(16,185,129,0.15)';
  btn.style.borderColor = 'rgba(16,185,129,0.5)';
  btn.style.color = '#6ee7b7';
  const status = document.getElementById('docUrlStatus');
  status.textContent = '資料URLを開きました。';
  status.className = 'url-status ok';
}

function checkUrlMini(url, btnEl) {
  if (!url) return;
  window.open(url, '_blank');
  btnEl.textContent = '✅ 確認済';
  btnEl.style.background = 'rgba(16,185,129,0.15)';
  btnEl.style.borderColor = 'rgba(16,185,129,0.4)';
  btnEl.style.color = '#6ee7b7';
  btnEl.dataset.confirmed = 'true';
}

// ===== 手動追加 =====
function addManual() {
  const title       = document.getElementById('f-title').value.trim();
  const instructor  = getInstructor();
  const url         = document.getElementById('f-url').value.trim();
  const docUrl      = document.getElementById('f-doc-url').value.trim();
  const pass        = document.getElementById('f-pass').value.trim();
  const note        = document.getElementById('f-note').value.trim();
  const audioUrl    = document.getElementById('f-audio-url').value.trim();
  const summary     = document.getElementById('f-summary').value.trim();
  const lectureDate = document.getElementById('f-lecture-date').value;

  if (!title && !url) { showToast('⚠️ 講座名かURLを入力してください', '#f59e0b'); return; }
  const checkBtn = document.getElementById('checkBtn');
  if (url && checkBtn.dataset.confirmed !== 'true') {
    showToast('⚠️ まず「確認」ボタンでURLを開いてください', '#f59e0b');
    document.getElementById('f-url').focus();
    return;
  }

  const data = load();
  data.unshift({ id: Date.now(), title, instructor, url, docUrl, pass, note, audioUrl, summary, lectureDate, platform: getPlatform(url), createdAt: new Date().toISOString() });
  save(data);
  renderInstructorTabs();
  renderList();
  updateCount();

  // リセット
  ['f-title','f-url','f-pass','f-note','f-audio-url','f-summary','f-lecture-date'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-instructor-select').value = '';
  document.getElementById('f-instructor-manual').style.display = 'none';
  document.getElementById('f-instructor-manual').value = '';
  const dcb = document.getElementById('docCheckBtn');
  dcb.dataset.confirmed = '';
  dcb.textContent = '確認';
  dcb.style.background = dcb.style.borderColor = dcb.style.color = '';
  dcb.disabled = true;
  document.getElementById('docUrlStatus').textContent = '';
  document.getElementById('docUrlStatus').className = 'url-status';
  const cb = document.getElementById('checkBtn');
  cb.dataset.confirmed = '';
  cb.textContent = '確認';
  cb.style.background = '';
  cb.style.borderColor = '';
  cb.style.color = '';
  cb.disabled = true;
  document.getElementById('urlStatus').textContent = '';
  document.getElementById('urlStatus').className = 'url-status';
  document.getElementById('addBtn').classList.remove('locked');
  showToast('✅ 追加しました！');
}

// ===== メモ解析 =====
function parseMemo() {
  const text = document.getElementById('memoInput').value;
  if (!text.trim()) { showToast('⚠️ テキストを貼り付けてください', '#f59e0b'); return; }

  const urlRegex = /https?:\/\/[^\s\n\r　、。！？「」【】（）\)>]+/g;
  const lines = text.split(/\n/);
  const results = [];

  lines.forEach((line, idx) => {
    const urls = line.match(urlRegex);
    if (!urls) return;

    urls.forEach(url => {
      // URL前後の行からタイトル候補を探す
      const cleanLine = line.replace(urlRegex, '').replace(/[▶📹📎📄🔗🎬💻✅★▼►\[\]「」【】]/g, '').trim();
      const prevLine  = (lines[idx - 1] || '').replace(urlRegex, '').trim();
      const nextLine  = (lines[idx + 1] || '').replace(urlRegex, '').trim();

      // タイトル候補（最も長い非空文字列を優先）
      const candidates = [cleanLine, prevLine, nextLine].filter(s => s.length > 0);
      let title = candidates.sort((a, b) => b.length - a.length)[0] || '';

      // 講師名抽出：「｜」「/」「：」「さん」「氏」などで区切る
      let instructor = '';
      const instructorMatch = title.match(/^([^\|｜\/／：:\n]{2,10})[｜|\/／：:]/);
      if (instructorMatch) {
        instructor = instructorMatch[1].trim();
        title = title.replace(instructorMatch[0], '').trim();
      }

      // パスコード抽出
      let pass = '';
      const passMatch = text.match(/(?:パスコード|パスワード|PW|pass)[^\n]*?[:：]?\s*([A-Za-z0-9!@#$%^&*()_+\-=\[\]{}|;':",.<>?\/`~\\]{4,20})/i);
      if (passMatch) pass = passMatch[1].trim();

      // タイトルの長さ制限（URLっぽいものを除外）
      if (title.includes('http') || title.length < 2) title = '';

      results.push({ url: url.replace(/[.,)>]+$/, ''), title, instructor, pass, checked: true });
    });
  });

  if (results.length === 0) { showToast('⚠️ URLが見つかりませんでした', '#f59e0b'); return; }

  // 重複除去
  const unique = results.filter((r, i, arr) => arr.findIndex(x => x.url === r.url) === i);

  const preview = document.getElementById('parsedPreview');
  const list    = document.getElementById('parsedList');
  list.innerHTML = '';

  unique.forEach((item, i) => {
    list.innerHTML += `
      <div class="parsed-item">
        <input type="checkbox" id="pc${i}" ${item.checked ? 'checked' : ''}>
        <div class="parsed-item-info">
          <div class="pi-edit">
            <input type="text" id="pt${i}" value="${escHtml(item.title)}" placeholder="講座名">
            <input type="text" id="pi${i}" value="${escHtml(item.instructor)}" placeholder="講師名">
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
            <div class="pi-url" style="flex:1" title="${escHtml(item.url)}">${escHtml(item.url)}</div>
            <button class="btn-check-mini" onclick="checkUrlMini('${escHtml(item.url)}', this)">確認</button>
          </div>
          ${item.pass ? `<div style="font-size:0.68rem;color:#f59e0b;margin-top:3px">🔑 ${escHtml(item.pass)}</div>` : ''}
        </div>
      </div>`;
  });

  preview.classList.add('show');
  preview._data = unique;
}

// ===== 解析結果を登録 =====
function addParsed() {
  const preview = document.getElementById('parsedPreview');
  const items   = preview._data || [];
  const data    = load();
  let count     = 0;

  items.forEach((item, i) => {
    if (!document.getElementById(`pc${i}`).checked) return;
    const title      = document.getElementById(`pt${i}`).value.trim();
    const instructor = document.getElementById(`pi${i}`).value.trim();
    const url        = item.url;
    data.unshift({ id: Date.now() + i, title, instructor, url, pass: item.pass || '', note: '', platform: getPlatform(url), createdAt: new Date().toISOString() });
    count++;
  });

  save(data);
  renderInstructorTabs();
  renderList();
  updateCount();
  document.getElementById('memoInput').value = '';
  preview.classList.remove('show');
  showToast(`✅ ${count}件を登録しました！`);
}

// ===== 削除（確認モーダル） =====
let _deleteTargetId = null;

function deleteItem(id) {
  const d = load().find(x => x.id === id);
  if (!d) return;
  _deleteTargetId = id;

  const title = d.title || d.url || '（タイトル未設定）';
  const short = title.length > 30 ? title.slice(0, 30) + '…' : title;
  document.getElementById('deleteModalMsg').innerHTML =
    `「<strong>${escHtml(short)}</strong>」を削除します。<br>削除後は元に戻せません。`;

  document.getElementById('deleteModal').classList.add('show');
}

function confirmDelete() {
  if (_deleteTargetId === null) return;
  const data = load().filter(d => d.id !== _deleteTargetId);
  save(data);
  _deleteTargetId = null;
  closeDeleteModal();
  renderInstructorTabs();
  renderList();
  updateCount();
  showToast('🗑️ 削除しました', '#ef4444');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('show');
  _deleteTargetId = null;
}

function onDeleteOverlayClick(e) {
  if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
}

// ===== 編集モーダル =====
function openEditModal(id) {
  const d = load().find(x => x.id === id);
  if (!d) return;

  // モーダルにデータをセット
  const knownInstructors = ['いけとも（池田朋弘）','うすたく（Michikusa）','佐藤勝彦','NewSchool','越川慎司'];
  const sel = document.getElementById('e-instructor-select');
  const manual = document.getElementById('e-instructor-manual');
  if (knownInstructors.includes(d.instructor)) {
    sel.value = d.instructor;
    manual.style.display = 'none';
    manual.value = '';
  } else {
    sel.value = '__manual__';
    manual.style.display = 'block';
    manual.value = d.instructor || '';
  }
  document.getElementById('e-title').value     = d.title || '';
  document.getElementById('e-url').value       = d.url || '';
  document.getElementById('e-doc-url').value   = d.docUrl || '';
  document.getElementById('e-pass').value      = d.pass || '';
  document.getElementById('e-note').value      = d.note || '';
  document.getElementById('e-audio-url').value    = d.audioUrl || '';
  document.getElementById('e-summary').value      = d.summary || '';
  document.getElementById('e-lecture-date').value = d.lectureDate || '';

  // 編集中IDを保存
  document.getElementById('modalOverlay').dataset.editId = id;
  document.getElementById('modalOverlay').classList.add('show');
}

function onEditInstructorSelect() {
  const sel = document.getElementById('e-instructor-select');
  const manual = document.getElementById('e-instructor-manual');
  if (sel.value === '__manual__') {
    manual.style.display = 'block';
    manual.focus();
  } else {
    manual.style.display = 'none';
    manual.value = '';
  }
}

function getEditInstructor() {
  const sel = document.getElementById('e-instructor-select');
  return sel.value === '__manual__'
    ? document.getElementById('e-instructor-manual').value.trim()
    : sel.value;
}

function saveEdit() {
  const id    = Number(document.getElementById('modalOverlay').dataset.editId);
  const data  = load();
  const idx   = data.findIndex(x => x.id === id);
  if (idx === -1) return;

  const url = document.getElementById('e-url').value.trim();
  data[idx] = {
    ...data[idx],
    instructor: getEditInstructor(),
    title:      document.getElementById('e-title').value.trim(),
    url,
    docUrl:     document.getElementById('e-doc-url').value.trim(),
    pass:       document.getElementById('e-pass').value.trim(),
    note:       document.getElementById('e-note').value.trim(),
    platform:   getPlatform(url),
    audioUrl:    document.getElementById('e-audio-url').value.trim(),
    summary:     document.getElementById('e-summary').value.trim(),
    lectureDate: document.getElementById('e-lecture-date').value,
  };

  save(data);
  renderInstructorTabs();
  renderList();
  closeModal();
  showToast('💾 保存しました！');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function onOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ===== 講師タブ描画 =====
let activeInstructor = 'all';

function renderInstructorTabs() {
  const data = load();
  const counts = {};
  data.forEach(d => {
    const key = d.instructor || '（未設定）';
    counts[key] = (counts[key] || 0) + 1;
  });

  const instructors = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ja'));
  const container = document.getElementById('instructorTabs');

  container.innerHTML = `
    <button class="itab ${activeInstructor === 'all' ? 'active' : ''}" onclick="selectInstructor('all')">
      すべて <span class="itab-count">${data.length}</span>
    </button>
    ${instructors.map(name => `
      <button class="itab ${activeInstructor === name ? 'active' : ''}" onclick="selectInstructor('${escHtml(name)}')">
        ${escHtml(name)} <span class="itab-count">${counts[name]}</span>
      </button>
    `).join('')}
  `;
}

function selectInstructor(name) {
  activeInstructor = name;
  renderInstructorTabs();
  renderList();
}

// ===== 一覧描画 =====
function renderList() {
  const query  = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('filterSelect').value;
  const sort   = document.getElementById('sortSelect').value;
  const data   = load();

  const filtered = data.filter(d => {
    const matchQ = !query || (d.title + d.instructor + d.url).toLowerCase().includes(query);
    const matchF = !filter || d.platform === filter;
    const matchI = activeInstructor === 'all' || (d.instructor || '（未設定）') === activeInstructor;
    return matchQ && matchF && matchI;
  });

  // 並び替え
  filtered.sort((a, b) => {
    if (sort === 'title')        return (a.title || '').localeCompare(b.title || '', 'ja');
    if (sort === 'instructor')   return (a.instructor || '').localeCompare(b.instructor || '', 'ja');
    if (sort === 'date-asc')     return a.id - b.id;
    if (sort === 'lecture-desc') {
      const da = a.lectureDate || '0000-00-00';
      const db = b.lectureDate || '0000-00-00';
      return db.localeCompare(da); // 新しい順（日付なしは最後）
    }
    if (sort === 'lecture-asc') {
      const da = a.lectureDate || '9999-99-99';
      const db = b.lectureDate || '9999-99-99';
      return da.localeCompare(db); // 古い順（日付なしは最後）
    }
    return b.id - a.id; // デフォルト：登録順（新しい順）
  });

  const container = document.getElementById('cardsList');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <p>${data.length === 0 ? '左のパネルから講座を追加してください' : '条件に一致する講座がありません'}</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(d => {
    const p = d.platform || getPlatform(d.url);
    const hasLearn = !!(d.summary || d.audioUrl);
    return `
      <div class="card" id="card-${d.id}">
        <div class="card-main">
          <div class="card-icon ${getPlatformColor(p)}">${getPlatformIcon(p)}</div>
          <div class="card-body">
            <div class="card-title" title="${escHtml(d.title || d.url)}">${escHtml(d.title || '（タイトル未設定）')}</div>
            <div class="card-meta">
              ${d.instructor ? `<span class="card-instructor">${escHtml(d.instructor)}</span>` : ''}
              <span class="${getPlatformColor(p)}" style="padding:2px 7px;border-radius:20px;font-size:0.68rem;font-weight:600;">${getPlatformLabel(p)}</span>
              ${d.lectureDate ? `<span class="card-date">📅 ${fmtDate(d.lectureDate)}</span>` : ''}
              ${d.pass ? `<span style="color:#f59e0b;font-size:0.68rem">🔑 ${escHtml(d.pass)}</span>` : ''}
            </div>
            <div class="card-url" title="${escHtml(d.url)}">${escHtml(d.url)}</div>
            ${d.note ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px">${escHtml(d.note)}</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn-icon btn-open" onclick="openUrl('${escHtml(d.url)}')" title="動画を開く">↗</button>
            ${d.docUrl ? `<button class="btn-icon btn-doc-open" onclick="openUrl('${escHtml(d.docUrl)}')" title="資料を開く">📄</button>` : ''}
            <button class="btn-icon btn-learn ${hasLearn ? 'has-learn' : ''}" onclick="toggleLearn(${d.id})" title="学び・示唆">🧠</button>
            <button class="btn-icon btn-edit" onclick="openEditModal(${d.id})" title="編集">✏️</button>
            <button class="btn-icon btn-delete" onclick="deleteItem(${d.id})" title="削除">✕</button>
          </div>
        </div>
        <div class="learn-section" id="learn-${d.id}">
          ${d.audioUrl ? `
            <div class="learn-row">
              <div class="learn-label">🎙 音声録画</div>
              <a class="learn-audio-btn" href="${escHtml(d.audioUrl)}" target="_blank">▶ 音声・録画を開く</a>
            </div>` : ''}
          ${d.summary ? `
            <div class="learn-row">
              <div class="learn-label">📝 学び・要約</div>
              <div class="learn-text">${escHtml(d.summary)}</div>
            </div>` : ''}
          ${!d.audioUrl && !d.summary ? `
            <div style="font-size:0.8rem;color:var(--text-muted);text-align:center;padding:8px 0">
              ✏️ 編集ボタンから学びを追加できます
            </div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function updateCount() {
  document.getElementById('countBadge').textContent = load().length + ' 件';
}

function openUrl(url) {
  if (url) window.open(url, '_blank');
}

function toggleLearn(id) {
  const sec = document.getElementById(`learn-${id}`);
  if (sec) sec.classList.toggle('open');
}

// YYYY-MM-DD → YYYY/MM/DD 表示用
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${y}/${m}/${day}`;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, color = '#10b981') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== エクスポート =====
function exportData() {
  const data = load();
  if (data.length === 0) { showToast('⚠️ データが0件です', '#f59e0b'); return; }

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  a.href     = url;
  a.download = `lecture-archive_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`📤 ${data.length}件をエクスポートしました！`);
}

// ===== インポート =====
let _importBuffer = null; // ファイルから読み込んだデータを一時保存

function triggerImport() {
  document.getElementById('importFileInput').value = '';
  document.getElementById('importFileInput').click();
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed)) throw new Error('配列形式ではありません');

      _importBuffer = parsed;
      const existing = load();

      // 重複チェック（マージ時の参考情報）
      const existingIds = new Set(existing.map(d => d.id));
      const newCount    = parsed.filter(d => !existingIds.has(d.id)).length;
      const dupCount    = parsed.length - newCount;

      const infoEl = document.getElementById('importInfo');
      infoEl.innerHTML = `
        ファイル内のデータ：<strong>${parsed.length}件</strong><br>
        うち新規：<strong style="color:#6ee7b7">${newCount}件</strong>、
        重複（スキップ予定）：<strong style="color:#f59e0b">${dupCount}件</strong><br><br>
        どのように取り込みますか？
      `;

      document.getElementById('importModal').classList.add('show');
    } catch (err) {
      showToast('⚠️ ファイルの形式が正しくありません', '#ef4444');
    }
  };
  reader.readAsText(file);
}

function doImport(mode) {
  if (!_importBuffer) return;
  const imported = _importBuffer;

  if (mode === 'replace') {
    save(imported);
    showToast(`🔄 ${imported.length}件に完全置き換えしました！`);
  } else {
    // マージ：既存IDと重複しないものだけ追加
    const existing   = load();
    const existingIds = new Set(existing.map(d => d.id));
    const toAdd      = imported.filter(d => !existingIds.has(d.id));
    const merged     = [...toAdd, ...existing];
    save(merged);
    showToast(`✅ ${toAdd.length}件を追加しました！（重複${imported.length - toAdd.length}件スキップ）`);
  }

  _importBuffer = null;
  closeImportModal();
  renderInstructorTabs();
  renderList();
  updateCount();
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('show');
  _importBuffer = null;
}

function onImportOverlayClick(e) {
  if (e.target === document.getElementById('importModal')) closeImportModal();
}
